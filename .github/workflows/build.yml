name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      ARTEFACTS: build/openEDMDelay_artefacts/Release
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -B build -A x64
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Native tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload preview screenshot
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshot
          path: build/screenshots/openEDMDelay.png
          if-no-files-found: error
      - name: Native tests with display
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Sign macOS bundles
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openEDMDelay.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openEDMDelay.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openEDMDelay.app"
      - name: Validate macOS VST3
        if: runner.os == 'macOS'
        run: |
          curl --fail --location --silent --show-error -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openEDMDelay.vst3"
      - name: Validate Windows VST3
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openEDMDelay.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: bash
        run: |
          python3 scripts/package.py "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: openEDMDelay-${{ matrix.name }}
          path: dist/*.zip
  sanitizers:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DOED_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 4 && ctest --test-dir build --output-on-failure
  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.native.result == 'success' && (needs.sanitizers.result == 'skipped' || needs.sanitizers.result == 'success') }}
    needs: [native, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Release notes
        run: python3 scripts/release_body.py release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: dist/*
          generate_release_notes: true

  update-preview:
    # Refreshes docs/screenshots/preview.png (the image OpenVST Manager shows) from the
    # real editor capture whenever UI-affecting files change on main.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: preview-screenshot
          path: preview
      - name: Commit refreshed preview if changed
        run: |
          # Capture names before searching. `grep -q` in a pipefail pipeline
          # SIGPIPEs `git diff` on the first match, the pipeline fails, and the
          # `||` branch then skips a real UI change.
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          names=""
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! names="$(git diff --name-only "$before" "$sha")"; then
            echo "Could not diff this push; refreshing preview."
            names="Source/"
          fi
          ui=0
          while IFS= read -r path; do
            case "$path" in
              Source/*|assets/*|Tools/*|tools/*|Tests/*) ui=1 ;;
            esac
          done <<EOF
          $names
          EOF
          if [ "$ui" -ne 1 ]; then echo "No UI changes; keeping preview."; exit 0; fi
          mkdir -p docs/screenshots
          cp "preview/openEDMDelay.png" docs/screenshots/preview.png
          if git diff --quiet -- docs/screenshots/preview.png; then echo "Preview unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
